[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# 1️⃣ API → Netlify Functions
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# 2️⃣ SPA fallback (Vite / Vue / React)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200